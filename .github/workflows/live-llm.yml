name: Live LLM check

# Calls the hosted NVIDIA API with the repository secret NVIDIA_API_KEY. `live` sends one short
# streaming request per catalogued model straight through the adapter (ADR 0008, V2/V3);
# `live-e2e` then starts the built image with docker compose and asks through the HTTP API,
# once as JSON and once as an event stream. The jobs run one after the other, never calling
# NVIDIA at the same time. It never runs on ordinary PR pushes; label a PR `live-llm`, run it
# by hand, or merge to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  HUSKY: "0"
  NODE_VERSION: "22.23.3"

jobs:
  live:
    name: Live hosted-LLM check
    # On a PR: only for the live-llm label and only for this repository's own branches. Whoever
    # labels a PR runs its code with the key, so read the diff (.github/, test/, package.json)
    # before labelling.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.label.name == 'live-llm' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    # At job level, so a skipped run (another label) never displaces a pending live run.
    concurrency:
      group: live-llm-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a PR, the commit that was labelled, not whatever the branch holds when the job starts.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the live check
        id: live
        shell: bash
        working-directory: apps/server
        timeout-minutes: 8
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_LIVE_TESTS: "1"
          EVENT_NAME: ${{ github.event_name }}
        run: |
          : > "$RUNNER_TEMP/live-llm.log"
          if [ -z "$NVIDIA_API_KEY" ]; then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              echo "::notice::NVIDIA_API_KEY is not available to this run; the live check was skipped."
              exit 0
            fi
            echo "::error::NVIDIA_API_KEY is empty, so the live check cannot run."
            exit 1
          fi
          # Model output must not be read as workflow commands.
          stop_token="live-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop_token"
          status=0
          pnpm exec vitest run --project unit test/adapters/nvidia-live.test.ts 2>&1 \
            | tee "$RUNNER_TEMP/live-llm.log" || status=$?
          echo "::$stop_token::"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if ! grep -q 'LIVE_RESULT' "$RUNNER_TEMP/live-llm.log"; then
            echo "::error::The live check ran no model."
            exit 1
          fi
      - name: The output holds no key
        id: scan
        if: always()
        shell: bash
        run: |
          if grep -q 'nvapi-' "$RUNNER_TEMP/live-llm.log"; then
            echo "::error::The output contains a key-shaped string: rotate NVIDIA_API_KEY and delete this run's logs."
            exit 1
          fi
      - name: Show the results
        if: always() && steps.scan.outcome == 'success'
        shell: bash
        run: grep -h 'LIVE_RESULT' "$RUNNER_TEMP/live-llm.log" || echo "No live results."

  live-e2e:
    name: Live hosted-LLM answer through the API
    # The same guard as `live`: never for another label or a pull request from a fork. This job
    # builds and runs the PR's Dockerfile, docker-compose.yml and apps/server/src with the key in
    # the api container, so before labelling also read the diff of those files, not only
    # .github/, test/ and package.json: any of them could send the key elsewhere unnoticed.
    # After `live`, so the two jobs never call NVIDIA at the same time (429s); also when `live`
    # failed, so that both results are reported.
    needs: live
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
      (github.event.label.name == 'live-llm' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    concurrency:
      group: live-llm-e2e-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    # Image build (~2 min), at most two JSON sends of a 150 s wait and 60 s of polling each,
    # and one streamed send of at most 200 s.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare a CI-only catalog with short answers
        shell: bash
        run: |
          # The shipped catalog stays unchanged. This copy caps the default NVIDIA model at 32
          # output tokens, so the client request carries no max_tokens (the server sends the cap).
          mkdir -p "$RUNNER_TEMP/live-e2e"
          jq '.providers.nvidia.defaultModel as $model
            | (.providers.nvidia.models[] | select(.id == $model) | .maxOutputTokens) = 32' \
            apps/server/config/models.json > "$RUNNER_TEMP/models.live.json"
          jq -e '.providers.nvidia.defaultModel as $model
            | [.providers.nvidia.models[] | select(.id == $model and .maxOutputTokens == 32)]
            | length == 1' "$RUNNER_TEMP/models.live.json" > /dev/null
          printf '%s\n' \
            'services:' \
            '  api:' \
            '    environment:' \
            '      MODEL_CATALOG_PATH: /etc/llm-chat/models.json' \
            '    volumes:' \
            "      - \"$RUNNER_TEMP/models.live.json:/etc/llm-chat/models.json:ro\"" \
            > "$RUNNER_TEMP/compose.live.yml"
          {
            echo "COMPOSE_PROJECT_NAME=live-e2e"
            echo "COMPOSE_FILE=docker-compose.yml:$RUNNER_TEMP/compose.live.yml"
          } >> "$GITHUB_ENV"
      - name: Build the image
        run: docker compose build
      - name: Start postgres → migrate → api with the repository key
        id: start
        shell: bash
        env:
          # The only step that sees the key: compose passes it into the api container's env.
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          PROVIDERS_ENABLED: demo,nvidia
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::notice::NVIDIA_API_KEY is not available to this run; the end-to-end check was skipped."
            echo "started=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Before `up`: even a start that fails half-way gets its logs scanned for the key.
          echo "started=true" >> "$GITHUB_OUTPUT"
          docker compose up -d --no-build
      - name: Wait for /health/ready (90 s)
        id: ready
        if: steps.start.outputs.started == 'true'
        shell: bash
        run: |
          for _ in $(seq 1 90); do
            if curl -sf --max-time 5 http://127.0.0.1:3000/health/ready; then echo; exit 0; fi
            sleep 1
          done
          echo "::error::/health/ready did not answer 200 within 90 s"
          exit 1
      - name: Ask one question through the API
        if: steps.start.outputs.started == 'true'
        shell: bash
        timeout-minutes: 9
        run: |
          set -euo pipefail
          api=http://127.0.0.1:3000
          out="$RUNNER_TEMP/live-e2e"
          status=$(curl -sS -o "$out/session.json" -w '%{http_code}' --max-time 30 \
            -X POST "$api/sessions" -H 'content-type: application/json' \
            -d '{"provider":"nvidia"}') || status=000
          if [ "$status" != 201 ]; then
            echo "::error::POST /sessions answered $status"
            exit 1
          fi
          session=$(jq -er .id "$out/session.json")
          # Model output must not be read as workflow commands; resume them on every exit path.
          stop_token="live-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          resume() {
            if [ -n "$stop_token" ]; then echo "::$stop_token::"; stop_token=""; fi
          }
          trap resume EXIT
          echo "::stop-commands::$stop_token"
          for attempt in 1 2; do
            body="$out/send-$attempt.json"
            message="$out/answer-$attempt.json"
            # JSON mode with a long wait and no max_tokens: the CI catalog caps the answer.
            status=$(curl -sS -o "$body" -w '%{http_code}' --max-time 200 \
              -X POST "$api/sessions/$session/messages" \
              -H 'content-type: application/json' -H 'Prefer: wait=150' \
              -d '{"content":"What is the capital of France? Answer in one short sentence."}') \
              || status=000
            echo "attempt $attempt: the send answered HTTP $status"
            case "$status" in
              200 | 202 | 502) jq -e .assistantMessage "$body" > "$message" || echo '{}' > "$message" ;;
              *) echo '{}' > "$message" ;;
            esac
            if [ "$status" = 202 ] && jq -e .id "$message" > /dev/null; then
              # Still generating: poll the assistant message for up to 60 s.
              mid=$(jq -er .id "$message")
              for _ in $(seq 1 12); do
                sleep 5
                # A poll that fails (connection, timeout, non-2xx) is tried again on the next
                # round; the last good state is kept.
                if curl -sSf --max-time 30 -o "$message.poll" \
                  "$api/sessions/$session/messages/$mid"; then
                  mv "$message.poll" "$message"
                else
                  echo "a poll request failed; trying again"
                fi
                if [ "$(jq -r .status "$message" 2> /dev/null || echo unknown)" != generating ]; then
                  break
                fi
              done
              # A failure seen while polling counts like the 502 the send would have answered.
              if [ "$(jq -r .status "$message" 2> /dev/null || echo unknown)" = failed ]; then
                status=502
              fi
            fi
            # The answer text and usage only; never request headers.
            jq -c '{status, model, finishReason, usage, errorCode, answer: .content}' "$message"
            if jq -e '.status == "completed" and (.content | length > 0)' "$message" > /dev/null; then
              resume
              echo "A completed answer came back through the API."
              exit 0
            fi
            # One more attempt only after a 429 or 5xx that a new try could fix.
            case "$status" in
              429 | 5??)
                if jq -e '.errorCode == "llm_auth_failed" or .errorCode == "llm_context_overflow"' \
                  "$message" > /dev/null; then
                  break
                fi
                ;;
              *) break ;;
            esac
          done
          resume
          echo "::error::No completed, non-empty answer came back through the API."
          exit 1
      - name: Stream one answer through the API
        # Also after a failed JSON step, so that both results are reported.
        if: ${{ !cancelled() && steps.ready.outcome == 'success' }}
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          api=http://127.0.0.1:3000
          out="$RUNNER_TEMP/live-e2e"
          status=$(curl -sS -o "$out/sse-session.json" -w '%{http_code}' --max-time 30 \
            -X POST "$api/sessions" -H 'content-type: application/json' \
            -d '{"provider":"nvidia"}') || status=000
          if [ "$status" != 201 ]; then
            echo "::error::POST /sessions answered $status"
            exit 1
          fi
          session=$(jq -er .id "$out/sse-session.json")
          # Model output must not be read as workflow commands; resume them on every exit path.
          stop_token="live-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          resume() {
            if [ -n "$stop_token" ]; then echo "::$stop_token::"; stop_token=""; fi
          }
          trap resume EXIT
          echo "::stop-commands::$stop_token"
          # One send as an event stream; the server ends the stream after done or error.
          status=$(curl -sS -N -o "$out/stream.txt" -w '%{http_code}' --max-time 200 \
            -X POST "$api/sessions/$session/messages" \
            -H 'content-type: application/json' -H 'Accept: text/event-stream' \
            -d '{"content":"What is the capital of France? Answer in one short sentence."}') \
            || status=000
          touch "$out/stream.txt"
          events=$(grep -c '^event: ' "$out/stream.txt" || true)
          deltas=$(grep -c '^event: delta$' "$out/stream.txt" || true)
          last=$( (grep '^event: ' "$out/stream.txt" || true) | tail -n 1 | cut -d ' ' -f 2-)
          # The final event's data line; the snapshot may already hold the whole answer, so
          # the number of deltas is reported but not required.
          (grep '^data: ' "$out/stream.txt" || true) | tail -n 1 | cut -c 7- > "$out/stream-last.json"
          echo "the streaming send answered HTTP $status: $events events, $deltas deltas, last: ${last:-none}"
          # The answer text and usage only; never request headers.
          jq -c '.assistantMessage | {status, model, finishReason, usage, errorCode, answer: .content}' \
            "$out/stream-last.json" 2> /dev/null || echo "the last event holds no message"
          if [ "$status" = 200 ] && [ "$last" = done ] && jq -e \
            '.assistantMessage.status == "completed" and (.assistantMessage.content | length > 0)' \
            "$out/stream-last.json" > /dev/null 2>&1; then
            resume
            echo "A completed answer came back as an event stream."
            exit 0
          fi
          resume
          echo "::error::The event stream did not end with done and a completed, non-empty answer."
          exit 1
      - name: Responses and logs hold no key
        id: scan
        if: always() && steps.start.outputs.started == 'true'
        shell: bash
        run: |
          # NVIDIA keys start with nvapi-; GitHub additionally masks the exact secret value.
          mkdir -p "$RUNNER_TEMP/live-e2e"
          # Without the containers' logs the scan below would pass without having seen them.
          if ! docker compose logs --no-color > "$RUNNER_TEMP/live-e2e/compose.log" 2>&1; then
            echo "::error::docker compose logs failed, so the container logs could not be scanned."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/live-e2e/compose.log" ]; then
            echo "::error::The container logs are empty, so there was nothing to scan."
            exit 1
          fi
          if grep -rq 'nvapi-' "$RUNNER_TEMP/live-e2e"; then
            echo "::error::A response or the container logs contain a key-shaped string: rotate NVIDIA_API_KEY and delete this run's logs."
            exit 1
          fi
      - name: Container logs
        if: failure() && steps.scan.outcome == 'success'
        shell: bash
        run: |
          stop_token="logs-$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
          echo "::stop-commands::$stop_token"
          tail -n 200 "$RUNNER_TEMP/live-e2e/compose.log"
          echo "::$stop_token::"
      - name: Tear down
        if: always()
        run: docker compose down -v || true
