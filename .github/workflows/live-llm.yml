name: Live LLM check

# Calls the hosted NVIDIA API with the repository secret NVIDIA_API_KEY: one short streaming
# request per catalogued model (ADR 0008, V2/V3). It never runs on ordinary PR pushes; label a
# PR `live-llm`, run it by hand, or merge to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: live-llm-${{ github.ref }}
  cancel-in-progress: false

env:
  HUSKY: "0"
  NODE_VERSION: "22.23.3"

jobs:
  live:
    name: Live hosted-LLM check
    if: github.event_name != 'pull_request' || github.event.label.name == 'live-llm'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the live check
        id: live
        shell: bash
        working-directory: apps/server
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          LLM_LIVE_TESTS: "1"
        run: |
          : > "$RUNNER_TEMP/live-llm.log"
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::notice::NVIDIA_API_KEY is not available to this run; the live check was skipped."
            exit 0
          fi
          pnpm exec vitest run --project unit test/adapters/nvidia-live.test.ts 2>&1 \
            | tee "$RUNNER_TEMP/live-llm.log"
      - name: The output holds no key
        id: scan
        if: always()
        shell: bash
        run: |
          if grep -q 'nvapi-' "$RUNNER_TEMP/live-llm.log"; then
            echo "::error::The live check output contains a key-shaped string."
            exit 1
          fi
      - name: Show the results
        if: always() && steps.scan.outcome == 'success'
        shell: bash
        run: grep -h 'LIVE_RESULT' "$RUNNER_TEMP/live-llm.log" || echo "No live results."
