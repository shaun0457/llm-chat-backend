# One command: postgres (healthy) → migrate (one-shot, exits 0) → api on http://localhost:3000.
# Defaults work without a .env file; copy .env.example to .env to change them.

x-app: &app
  build: .
  image: llm-chat-backend:local
  environment: &app-env
    DATABASE_URL: postgres://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD:-chat}@postgres:5432/${POSTGRES_DB:-chat}

services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat}
      POSTGRES_DB: ${POSTGRES_DB:-chat}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
    # Not published to the host. To connect a local client, add (keep the loopback address;
    # the default password is for local use only): ports: ["127.0.0.1:5432:5432"]

  migrate:
    <<: *app
    command: ["node", "dist/migrate.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROVIDERS_ENABLED: ${PROVIDERS_ENABLED:-demo}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-demo}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-}
      FLUSH_INTERVAL_MS: ${FLUSH_INTERVAL_MS:-1000}
      DEMO_DELAY_MS: ${DEMO_DELAY_MS:-50}
      JSON_DEFAULT_WAIT_MS: ${JSON_DEFAULT_WAIT_MS:-30000}
      JSON_MAX_WAIT_MS: ${JSON_MAX_WAIT_MS:-195000}
      GENERATION_DEADLINE_MS: ${GENERATION_DEADLINE_MS:-180000}
      TERMINAL_STATEMENT_TIMEOUT_MS: ${TERMINAL_STATEMENT_TIMEOUT_MS:-3000}
      TERMINAL_WRITE_BUDGET_MS: ${TERMINAL_WRITE_BUDGET_MS:-10000}
      RECLAIM_GRACE_MS: ${RECLAIM_GRACE_MS:-50000}
    # Longer than the API's forced-exit timeout (statement timeout + terminal-write budget + 5 s,
    # 18 s by default), so that generations stopped by a shutdown can store their cancelled state.
    stop_grace_period: 20s
    # Loopback only: this file is a local stack with default credentials, not a deployment.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
