# One command: postgres (healthy) → migrate (one-shot, exits 0) → api on http://localhost:3000.
# Defaults work without a .env file; copy .env.example to .env to change them.
#
# Profile local-llm (README "Local model (Ollama)") adds ollama (healthy) → ollama-pull (one-shot)
# before the api starts; local-llm.env turns on the profile and enables the provider:
#   docker compose --env-file local-llm.env up --build

x-app: &app
  build: .
  image: llm-chat-backend:local
  environment: &app-env
    DATABASE_URL: postgres://${POSTGRES_USER:-chat}:${POSTGRES_PASSWORD:-chat}@postgres:5432/${POSTGRES_DB:-chat}

services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat}
      POSTGRES_DB: ${POSTGRES_DB:-chat}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 5s
      retries: 30
    # Not published to the host. To connect a local client, add (keep the loopback address;
    # the default password is for local use only): ports: ["127.0.0.1:5432:5432"]

  migrate:
    <<: *app
    command: ["node", "dist/migrate.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PROVIDERS_ENABLED: ${PROVIDERS_ENABLED:-demo}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-demo}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-}
      DEFAULT_SYSTEM_PROMPT: ${DEFAULT_SYSTEM_PROMPT:-}
      FLUSH_INTERVAL_MS: ${FLUSH_INTERVAL_MS:-1000}
      DEMO_DELAY_MS: ${DEMO_DELAY_MS:-50}
      JSON_DEFAULT_WAIT_MS: ${JSON_DEFAULT_WAIT_MS:-30000}
      JSON_MAX_WAIT_MS: ${JSON_MAX_WAIT_MS:-195000}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      # Used only when PROVIDERS_ENABLED includes ollama (profile local-llm).
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      GENERATION_DEADLINE_MS: ${GENERATION_DEADLINE_MS:-180000}
      TERMINAL_STATEMENT_TIMEOUT_MS: ${TERMINAL_STATEMENT_TIMEOUT_MS:-3000}
      TERMINAL_WRITE_BUDGET_MS: ${TERMINAL_WRITE_BUDGET_MS:-10000}
      RECLAIM_GRACE_MS: ${RECLAIM_GRACE_MS:-50000}
      MAX_ACTIVE_GENERATIONS: ${MAX_ACTIVE_GENERATIONS:-8}
      MAX_ACTIVE_PER_PROVIDER: ${MAX_ACTIVE_PER_PROVIDER:-4}
      SSE_PING_INTERVAL_MS: ${SSE_PING_INTERVAL_MS:-15000}
      SSE_BUFFER_LIMIT_BYTES: ${SSE_BUFFER_LIMIT_BYTES:-262144}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-10000}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
      RATE_LIMIT_GENERAL_PER_MIN: ${RATE_LIMIT_GENERAL_PER_MIN:-120}
      RATE_LIMIT_SEND_PER_MIN: ${RATE_LIMIT_SEND_PER_MIN:-20}
      # Unset by default: the local stack has no proxy in front, no browser origins and no
      # retention. See README "Security considerations" and "Data retention".
      TRUST_PROXY: ${TRUST_PROXY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-}
      RETENTION_INTERVAL_MS: ${RETENTION_INTERVAL_MS:-3600000}
    # Longer than the API's forced-exit timeout (statement timeout + terminal-write budget + 5 s,
    # 18 s by default), so that generations stopped by a shutdown can store their cancelled state.
    # Raising TERMINAL_STATEMENT_TIMEOUT_MS or TERMINAL_WRITE_BUDGET_MS means raising this too.
    stop_grace_period: 20s
    # Loopback only: this file is a local stack with default credentials, not a deployment.
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    # The only service on both networks: postgres and ollama never share one.
    networks: [default, llm]
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Only with the local-llm profile; without it the api starts as before.
      ollama-pull:
        condition: service_completed_successfully
        required: false

  # Profile local-llm: a CPU-only local model. Not published to the host; only the api reaches it.
  ollama:
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    profiles: ["local-llm"]
    networks: [llm]
    environment:
      # Two answers at a time, the same as the catalog's maxConcurrency for ollama: a third send
      # gets 503 provider_busy at once instead of queueing here until its deadline.
      OLLAMA_NUM_PARALLEL: "2"
      # Tokens per answer: twice the catalog's contextWindow (4,096). Ollama silently drops the
      # start of a longer prompt instead of failing, so this absorbs a token estimate that is
      # too low. Memory grows with OLLAMA_NUM_PARALLEL × OLLAMA_CONTEXT_LENGTH.
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      # The image has no curl; the CLI asks the server on 127.0.0.1:11434.
      test: ["CMD", "ollama", "list"]
      interval: 2s
      timeout: 5s
      retries: 30

  # One-shot: pulls the catalog's ollama model into the volume (a no-op once it is there).
  ollama-pull:
    image: ollama/ollama:0.35.1@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    profiles: ["local-llm"]
    networks: [llm]
    entrypoint: ["ollama"]
    command: ["pull", "qwen2.5:0.5b"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy

networks:
  default:
  # Ollama and its pull job, plus the api; the model download needs internet access.
  llm:

volumes:
  postgres-data:
  ollama-models:
